
services:
  postgres:
    image: postgres:16-alpine
    container_name: agentguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentguard
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentguard-network

  redis:
    image: redis:7-alpine
    container_name: agentguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentguard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agentguard:agentguard_pass@postgres:5432/agentguard
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FILE_SANDBOX_PATH: /app/sandbox
    volumes:
      - sandbox_data:/app/sandbox
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentguard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agentguard-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentguard-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agentguard:agentguard_pass@postgres:5432/agentguard
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FILE_SANDBOX_PATH: /app/sandbox
    volumes:
      - sandbox_data:/app/sandbox
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentguard-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentguard-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agentguard:agentguard_pass@postgres:5432/agentguard
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FILE_SANDBOX_PATH: /app/sandbox
    volumes:
      - sandbox_data:/app/sandbox
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentguard-network

volumes:
  postgres_data:
  redis_data:
  sandbox_data:

networks:
  agentguard-network:
    driver: bridge

